<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="theme-color" content="#ffffff" />

    <meta
      name="description"
      content="Explore eight little curiosities in Jessie Chen's Playground."
    />

    <title>CHEN'S PLAYGROUND — Scene 1</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="./s1.css" />

    <!-- JAVASCRIPT -->
    <script src="./s1.js" defer></script>
  </head>

  <body>
    <!-- =====================================
       SCENE 1 — THE PLAYGROUND
       ===================================== -->

    <main class="scene-one" id="scene-one">
      <!-- BACK TO HOMEPAGE -->
      <a class="back-link" href="../homepage/index.html"> ← back </a>

      <!-- =====================================
         EIGHT BUBBLE GALLERIES
         ===================================== -->

      <div
        class="bubble-field"
        aria-label="Things to discover in the playground"
      >
        <!-- 01 — A LITTLE LIGHT -->
        <button
          class="bubble bubble-1"
          type="button"
          data-title="A Little Light"
          data-note="For ideas that refuse to sleep."
          data-images="../../drawing/7.png|../../drawing/8.png"
          data-slide-notes="For ideas that refuse to sleep.|A little light in an unexpected place."
        >
          <img class="bubble-ring" src="../../drawing/circle1.png" alt="" />

          <img class="bubble-doodle" src="../../drawing/8.png" alt="" />

          <span class="bubble-caption"> a little light </span>
        </button>

        <!-- 02 — AN EMPTY AFTERNOON -->
        <button
          class="bubble bubble-2"
          type="button"
          data-title="An Empty Afternoon"
          data-note="Nothing planned. Everything possible."
          data-images="../../drawing/12.png|../../drawing/14.png|../../drawing/13.png"
          data-slide-notes="Nothing planned. Everything possible.|A day with nowhere particular to go."
        >
          <img class="bubble-ring" src="../../drawing/circle2.png" alt="" />

          <span class="bubble-caption"> an empty afternoon </span>
        </button>

        <!-- 03 — THE UNRULY FOUNTAIN -->
        <button
          class="bubble bubble-3"
          type="button"
          data-title="The Unruly Fountain"
          data-note="A fountain that forgot which way is down."
          data-images="../../drawing/11.png|../../drawing/10.png"
          data-slide-notes="A fountain that forgot which way is down.|Water has its own ideas."
        >
          <img class="bubble-ring" src="../../drawing/circle3.png" alt="" />

          <img class="bubble-doodle" src="../../drawing/9.png" alt="" />

          <span class="bubble-caption"> the unruly fountain </span>
        </button>

        <!-- 04 — HANGING AROUND -->
        <button
          class="bubble bubble-4"
          type="button"
          data-title="Hanging Around"
          data-note="Some things are better left suspended."
          data-images="../../drawing/3.png|../../drawing/2.png|../../drawing/19.png"
          data-slide-notes="Some things are better left suspended.|Still hanging around, apparently."
        >
          <img class="bubble-ring" src="../../drawing/circle4.png" alt="" />

          <img
            class="bubble-doodle bubble-doodle--narrow"
            src="../../drawing/4.png"
            alt=""
          />

          <span class="bubble-caption"> hanging around </span>
        </button>

        <!-- 05 — ROOM FOR SOMETHING -->
        <button
          class="bubble bubble-5"
          type="button"
          data-title="Room for Something"
          data-note="Reserved for a beautiful accident."
          data-images="../../drawing/16.png|../../drawing/17.png"
          data-slide-notes="Reserved for a beautiful accident.|Something might happen here."
        >
          <img class="bubble-ring" src="../../drawing/circle1.png" alt="" />
          <img class="bubble-doodle" src="../../drawing/14.png" alt="" />

          <span class="bubble-caption"> room for something </span>
        </button>

        <!-- 06 — A SMALL PAUSE -->
        <button
          class="bubble bubble-6"
          type="button"
          data-title="A Small Pause"
          data-note="This circle is taking a break."
          data-images="../../drawing/5.png|../../drawing/18.png|../../drawing/20.png"
          data-slide-notes="This circle is taking a break.|A little more time to do absolutely nothing."
        >
          <img class="bubble-ring" src="../../drawing/circle2.png" alt="" />
          <img class="bubble-doodle" src="../../drawing/18.png" alt="" />
          <span class="bubble-caption"> a small pause </span>
        </button>

        <!-- 07 — A VERY SERIOUS CHAIR -->
        <button
          class="bubble bubble-7"
          type="button"
          data-title="A Very Serious Seat"
          data-note="Please don't sit too seriously."
          data-images="../../drawing/6.png|../../drawing/3.png|../../drawing/2.png|../../drawing/15.png"
          data-slide-notes="Please don't sit too seriously.|Even chairs deserve a little fun."
        >
          <img class="bubble-ring" src="../../drawing/circle3.png" alt="" />

          <img class="bubble-doodle" src="../../drawing/2.png" alt="" />

          <span class="bubble-caption"> a very serious chair </span>
        </button>

        <!-- 08 — NOT QUITE FINISHED -->
        <button
          class="bubble bubble-8"
          type="button"
          data-title="Not Quite "
          data-note="A tiny space for something unexpected."
          data-images="../../drawing/4.png|../../drawing/2.png"
          data-slide-notes="A tiny space for something unexpected.|To be continued, perhaps."
        >
          <img class="bubble-ring" src="../../drawing/circle4.png" alt="" />
          <img class="bubble-doodle" src="../../drawing/17.png" alt="" />
          <span class="bubble-caption"> not quite finished </span>
        </button>
      </div>
      <!-- END BUBBLE FIELD -->

      <!-- =====================================
         CURSOR-FOLLOWING HAND
         ===================================== -->

      <img
        id="hand-cursor"
        class="hand-cursor"
        src="../../drawing/fullhand.png"
        alt=""
        aria-hidden="true"
        draggable="false"
      />

      <footer class="scene-footer">
        <p>what are on the playground?</p>

        <!-- Interactive fish -->
        <button
          id="pet-fish"
          class="fish-touch"
          type="button"
          aria-label="Pet the fish"
        >
          <img
            class="footer-fish"
            src="../../drawing/fish2.png"
            alt=""
            draggable="false"
          />
        </button>
      </footer>
    </main>
    <!-- END SCENE 1 -->

    <!-- =====================================
       SERIES GALLERY MODAL

       Each bubble opens its own series.
       Images and descriptions change
       using data-images / data-slide-notes.
       ===================================== -->

    <div
      id="bubble-panel"
      class="bubble-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="panel-title"
      aria-describedby="panel-note"
      hidden
    >
      <div class="panel-content" tabindex="-1">
        <!-- CLOSE BUTTON -->
        <button
          id="close-panel"
          class="panel-close"
          type="button"
          aria-label="Close gallery"
        >
          ×
        </button>

        <!-- SERIES LABEL -->
        <span class="panel-index"> A SMALL DISCOVERY / 01 </span>

        <!-- SERIES TITLE -->
        <h2 id="panel-title"></h2>

        <!-- ARTWORK DESCRIPTION -->
        <p id="panel-note"></p>

        <!-- =====================================
           IMAGE SLIDER
           ===================================== -->

        <div class="series-viewer">
          <!-- PREVIOUS ARTWORK -->
          <button
            id="prev-artwork"
            class="series-arrow"
            type="button"
            aria-label="Previous artwork"
          >
            <span aria-hidden="true">◀</span>
          </button>

          <!-- CURRENT ARTWORK -->
          <a
            id="panel-link"
            href="../../drawing/2.png"
            target="_blank"
            rel="noopener"
            aria-label="Open artwork in a new tab"
          >
            <img
              id="panel-image"
              src="../../drawing/2.png"
              alt="Artwork from this series"
            />
          </a>

          <!-- NEXT ARTWORK -->
          <button
            id="next-artwork"
            class="series-arrow"
            type="button"
            aria-label="Next artwork"
          >
            <span aria-hidden="true">▶</span>
          </button>
        </div>
        <!-- END IMAGE SLIDER -->

        <!-- =====================================
           GALLERY FOOTER
           ===================================== -->

        <div class="series-meta">
          <!-- IMAGE COUNTER -->
          <span id="series-count" aria-live="polite"> 01 / 02 </span>

          <!-- ENLARGE IMAGE HINT -->
          <span class="panel-footnote">
            click the drawing to see it larger ↗
          </span>
        </div>
      </div>
      <!-- END PANEL CONTENT -->
    </div>
    <!-- END SERIES GALLERY -->
  </body>
</html>
